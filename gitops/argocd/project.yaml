apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: icollect
  namespace: argocd
spec:
  description: iCollect services
  sourceRepos:
    - https://github.com/shivasai-21/icollect-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: icollect-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
