image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/icollect/payment-service
  tag: REPLACE_WITH_IMAGE_TAG
containerPort: 8082
service:
  port: 8082
replicaCount: 1
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 768Mi
env:
  - name: JAVA_TOOL_OPTIONS
    value: -XX:MaxRAMPercentage=70
  - name: CUSTOMER_SERVICE_URL
    value: http://customer-service:8081
  - name: NOTIFICATION_SERVICE_URL
    value: http://notification-service:8083
probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  startup:
    failureThreshold: 36
    periodSeconds: 5
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /actuator/prometheus
  prometheus.io/port: "8082"
