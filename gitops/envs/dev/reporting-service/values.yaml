image:
  repository: 577152805698.dkr.ecr.ap-south-1.amazonaws.com/icollect/reporting-service
  tag: 0582d692
containerPort: 8084
service:
  port: 8084
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi
env:
  - name: PAYMENT_SERVICE_URL
    value: http://payment-service:8082
  - name: CUSTOMER_SERVICE_URL
    value: http://customer-service:8081
probes:
  livenessPath: /health
  readinessPath: /health
