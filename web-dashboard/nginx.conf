# Serves the dashboard and reverse-proxies /api/* to the four services.
# One entry point means the browser needs no CORS setup; this is the same job an Ingress does on Kubernetes.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/customers {
        proxy_pass http://customer-service:8081/customers;
    }
    location /api/payments {
        proxy_pass http://payment-service:8082/payments;
    }
    location /api/notifications {
        proxy_pass http://notification-service:8083/notifications;
    }
    location /api/reports {
        proxy_pass http://reporting-service:8084/reports;
    }

    # Used by Kubernetes probes and load balancer health checks
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
